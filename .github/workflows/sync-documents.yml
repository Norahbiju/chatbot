name: Sync Documents

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    name: Sync documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: tfversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ vars.TF_WORKING_DIRECTORY }}
          terraform-version: ${{ steps.tfversion.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ vars.TF_STATE_KEY }}

      - name: Resolve Knowledge Base storage
        id: kb
        shell: bash
        working-directory: ${{ vars.TF_WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          bucket="$(terraform output -raw source_document_bucket_name)"
          prefix="$(terraform output -raw document_prefix)"
          echo "bucket=${bucket}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"

      - name: Sync documents to S3
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="s3://${{ steps.kb.outputs.bucket }}/${{ steps.kb.outputs.prefix }}"
          aws s3 sync documents/ "${destination}" --delete
          {
            echo "## Document sync"
            echo
            echo "- Bucket: \`${{ steps.kb.outputs.bucket }}\`"
            echo "- Prefix: \`${{ steps.kb.outputs.prefix }}\`"
            echo "- Ingestion: automatic through S3 EventBridge, SQS, and Lambda"
          } >> "${GITHUB_STEP_SUMMARY}"
