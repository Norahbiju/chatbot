name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - "src/**"
      - "frontend/**"
      - "documents/**"
      - ".github/actions/terraform-bootstrap/**"
      - ".github/workflows/terraform.yml"
      - ".terraform-version"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options:
          - plan
          - apply
          - destroy
      source_run_id:
        required: false
        type: string
      destroy_confirmation:
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/terraform.yml
  STACK: infra
  ENVIRONMENT: dev
  WORKING_DIRECTORY: infra

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Terraform version
        id: tfversion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3 botocore

      - name: Terraform fmt
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive

      - name: Terraform static validate
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Python tests and audits
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall src scripts
          python -m unittest discover -s src/ingestion_lambda/tests
          python -m unittest discover -s src/query_lambda/tests
          python -m unittest discover -s scripts/tests
          python scripts/validate_iam.py
          python scripts/check_cost_guardrails.py

      - name: JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v node >/dev/null 2>&1; then
            node --check frontend/app.js
          else
            echo "Node.js unavailable; skipped JavaScript syntax validation."
          fi

  fork-pr-note:
    name: Fork PR plan note
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    needs: static-validation
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Explain skipped AWS plan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN }}
          script: |
            const marker = '<!-- terraform-plan:fork-skip -->';
            const body = `${marker}
            ## Terraform Plan Skipped

            This pull request comes from a fork, so AWS OIDC credentials were not issued. Static validation ran with \`terraform init -backend=false\`; an AWS-backed speculative plan must be run from a same-repository branch or manually by a maintainer.`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  pr-plan:
    name: Speculative PR plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: static-validation
    permissions:
      id-token: write
      contents: read
      issues: write
      actions: read
    env:
      STATE_KEY: ${{ vars.TF_STATE_PREFIX }}/dev/terraform.tfstate
      ARTIFACT_NAME: tfplan-pr-${{ github.run_id }}-infra-dev
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL }}
      TF_VAR_monthly_budget_limit_usd: ${{ vars.TF_MONTHLY_BUDGET_LIMIT_USD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Terraform version
        id: tfversion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Show plan role selection
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Using deployment role arn:aws:iam::484632959006:role/aws-chatbot for PR plans."

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          terraform-version: ${{ steps.tfversion.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/aws-chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ env.STATE_KEY }}

      - name: Terraform plan
        id: plan
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          args=(-input=false -lock-timeout=5m -detailed-exitcode -out=tfplan)
          if [[ -f terraform.tfvars ]]; then
            args+=("-var-file=terraform.tfvars")
          fi
          set +e
          terraform plan "${args[@]}" > tfplan.raw.txt 2>&1
          code=$?
          set -e
          cp tfplan.raw.txt tfplan.txt
          if [[ "${code}" -eq 0 ]]; then
            echo "status=no_changes" >> "${GITHUB_OUTPUT}"
          elif [[ "${code}" -eq 2 ]]; then
            echo "status=changes" >> "${GITHUB_OUTPUT}"
          else
            echo "status=failed" >> "${GITHUB_OUTPUT}"
          fi
          if [[ -f tfplan ]]; then
            terraform show -no-color tfplan > tfplan.txt
            sha256sum tfplan | awk '{print $1}' > tfplan.sha256
            echo "has_plan=true" >> "${GITHUB_OUTPUT}"
          else
            printf "no saved plan was produced\n" > tfplan
            sha256sum tfplan | awk '{print $1}' > tfplan.sha256
            echo "has_plan=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create non-applyable metadata
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          python ../scripts/create_plan_metadata.py \
            --output metadata.json \
            --plan-file tfplan \
            --lockfile .terraform.lock.hcl \
            --applyable false \
            --event pull_request \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --stack "${STACK}" \
            --environment "${ENVIRONMENT}" \
            --commit-sha "${GITHUB_SHA}" \
            --head-branch "${GITHUB_HEAD_REF}" \
            --default-branch "${GITHUB_REF_NAME}" \
            --terraform-version "${{ steps.tfversion.outputs.version }}" \
            --state-key "${STATE_KEY}"

      - name: Render PR plan comment
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          python ../scripts/render_plan_comment.py \
            --metadata metadata.json \
            --plan-text tfplan.txt \
            --artifact-name "${ARTIFACT_NAME}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --status "${{ steps.plan.outputs.status }}" \
            --output plan-comment.md

      - name: Upload speculative plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/tfplan
            ${{ env.WORKING_DIRECTORY }}/tfplan.txt
            ${{ env.WORKING_DIRECTORY }}/tfplan.sha256
            ${{ env.WORKING_DIRECTORY }}/metadata.json
          retention-days: 3
          if-no-files-found: error

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.WORKING_DIRECTORY}/plan-comment.md`, 'utf8');
            const marker = `<!-- terraform-plan:${process.env.STACK}:${process.env.ENVIRONMENT} -->`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Fail when plan failed
        if: steps.plan.outputs.status == 'failed'
        shell: bash
        run: |
          set -Eeuo pipefail
          exit 1

  manual-plan:
    name: Trusted manual plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    needs: static-validation
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      STATE_KEY: ${{ vars.TF_STATE_PREFIX }}/dev/terraform.tfstate
      ARTIFACT_NAME: tfplan-manual-${{ github.run_id }}-infra-dev
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL }}
      TF_VAR_monthly_budget_limit_usd: ${{ vars.TF_MONTHLY_BUDGET_LIMIT_USD }}
    steps:
      - name: Enforce default branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH:-${{ github.event.repository.default_branch }}}" ]]; then
            echo "Manual plan must run from the repository default branch." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Terraform version
        id: tfversion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          terraform-version: ${{ steps.tfversion.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/aws-chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ env.STATE_KEY }}

      - name: Terraform plan
        id: plan
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          args=(-input=false -lock-timeout=5m -detailed-exitcode -out=tfplan)
          if [[ -f terraform.tfvars ]]; then
            args+=("-var-file=terraform.tfvars")
          fi
          set +e
          terraform plan "${args[@]}"
          code=$?
          set -e
          if [[ "${code}" -eq 0 ]]; then
            echo "status=no_changes" >> "${GITHUB_OUTPUT}"
          elif [[ "${code}" -eq 2 ]]; then
            echo "status=changes" >> "${GITHUB_OUTPUT}"
          else
            exit "${code}"
          fi
          terraform show -no-color tfplan > tfplan.txt
          sha256sum tfplan | awk '{print $1}' > tfplan.sha256

      - name: Create applyable metadata
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          python ../scripts/create_plan_metadata.py \
            --output metadata.json \
            --plan-file tfplan \
            --lockfile .terraform.lock.hcl \
            --applyable true \
            --event workflow_dispatch \
            --action plan \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --stack "${STACK}" \
            --environment "${ENVIRONMENT}" \
            --commit-sha "${GITHUB_SHA}" \
            --head-branch "${GITHUB_REF_NAME}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --terraform-version "${{ steps.tfversion.outputs.version }}" \
            --state-key "${STATE_KEY}"

      - name: Publish job summary
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          {
            echo "## APPLYABLE MANUAL PLAN"
            echo
            echo "- Stack: \`${STACK}\`"
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Source run ID for apply: \`${GITHUB_RUN_ID}\`"
            echo "- Plan SHA-256: \`$(cat tfplan.sha256)\`"
            echo
            echo '```terraform'
            sed -n '1,400p' tfplan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload applyable plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/tfplan
            ${{ env.WORKING_DIRECTORY }}/tfplan.txt
            ${{ env.WORKING_DIRECTORY }}/tfplan.sha256
            ${{ env.WORKING_DIRECTORY }}/metadata.json
            ${{ env.WORKING_DIRECTORY }}/modules/core/.terraform/*.zip
            ${{ env.WORKING_DIRECTORY }}/modules/application/.terraform/*.zip
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply exact saved plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: terraform-dev-infra
      cancel-in-progress: false
    env:
      STATE_KEY: ${{ vars.TF_STATE_PREFIX }}/dev/terraform.tfstate
      ARTIFACT_NAME: tfplan-manual-${{ inputs.source_run_id }}-infra-dev
    steps:
      - name: Require source run ID and default branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${{ inputs.source_run_id }}"
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Apply must run from the repository default branch." >&2
            exit 1
          fi

      - name: Validate source run
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = Number('${{ inputs.source_run_id }}');
            const {owner, repo} = context.repo;
            const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.data.repository.full_name !== `${owner}/${repo}`) core.setFailed('Source run repository mismatch.');
            if (run.data.path !== process.env.WORKFLOW_FILE) core.setFailed('Source run workflow file mismatch.');
            if (run.data.event !== 'workflow_dispatch') core.setFailed('Source run was not workflow_dispatch.');
            if (run.data.status !== 'completed' || run.data.conclusion !== 'success') core.setFailed('Source run did not complete successfully.');
            if (run.data.head_branch !== '${{ github.event.repository.default_branch }}') core.setFailed('Source run was not from the default branch.');

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: downloaded-plan

      - name: Verify metadata and checkout exact commit
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(python -c 'import json; print(json.load(open("downloaded-plan/metadata.json"))["commitSha"])')"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          python scripts/verify_plan_metadata.py \
            --metadata downloaded-plan/metadata.json \
            --plan-file downloaded-plan/tfplan \
            --lockfile "${WORKING_DIRECTORY}/.terraform.lock.hcl" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --workflow-run-id "${{ inputs.source_run_id }}" \
            --stack "${STACK}" \
            --environment "${ENVIRONMENT}" \
            --state-key "${STATE_KEY}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --allow-lockfile-mismatch
          git checkout --detach "${commit_sha}"
          cp downloaded-plan/tfplan "${WORKING_DIRECTORY}/tfplan"
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Restore Lambda ZIP artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${WORKING_DIRECTORY}/modules/core/.terraform"
          mkdir -p "${WORKING_DIRECTORY}/modules/application/.terraform"
          if compgen -G "downloaded-plan/modules/core/.terraform/*.zip" > /dev/null; then
            cp downloaded-plan/modules/core/.terraform/*.zip "${WORKING_DIRECTORY}/modules/core/.terraform/"
          fi
          if compgen -G "downloaded-plan/modules/application/.terraform/*.zip" > /dev/null; then
            cp downloaded-plan/modules/application/.terraform/*.zip "${WORKING_DIRECTORY}/modules/application/.terraform/"
          fi

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          terraform-version: ${{ steps.metadata.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/aws-chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ env.STATE_KEY }}

      - name: Terraform apply saved plan
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          terraform apply -input=false -auto-approve tfplan | tee apply-output.txt
          {
            echo "## Terraform apply"
            echo
            echo "- Stack: \`${STACK}\`"
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Source plan run ID: \`${{ inputs.source_run_id }}\`"
            echo "- Commit: \`${{ steps.metadata.outputs.commit_sha }}\`"
            echo "- Plan SHA-256: \`$(python -c 'import json; print(json.load(open("../downloaded-plan/metadata.json"))["planSha256"])')\`"
            echo
            echo '```terraform'
            sed -n '1,400p' apply-output.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  destroy-plan:
    name: Destroy plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      STATE_KEY: ${{ vars.TF_STATE_PREFIX }}/dev/terraform.tfstate
      ARTIFACT_NAME: tfdestroy-manual-${{ github.run_id }}-infra-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce confirmation and default branch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Destroy must run from the repository default branch." >&2
            exit 1
          fi
          bash scripts/check_destroy_order.sh "${STACK}" "${ENVIRONMENT}" "${{ inputs.destroy_confirmation }}"

      - name: Read Terraform version
        id: tfversion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          terraform-version: ${{ steps.tfversion.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/aws-chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ env.STATE_KEY }}

      - name: Check active ingestion before destroy
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          kb_id="$(terraform output -raw knowledge_base_id 2>/dev/null || true)"
          ds_id="$(terraform output -raw data_source_id 2>/dev/null || true)"
          if [[ -n "${kb_id}" && -n "${ds_id}" ]]; then
            active="$(aws bedrock-agent list-ingestion-jobs --knowledge-base-id "${kb_id}" --data-source-id "${ds_id}" --query 'ingestionJobSummaries[?status==`STARTING` || status==`IN_PROGRESS`].ingestionJobId' --output text)"
            if [[ -n "${active}" ]]; then
              echo "Destroy blocked because a Knowledge Base ingestion job is active: ${active}" >&2
              exit 1
            fi
          else
            echo "Could not read KB/data source outputs; skipping active ingestion check."
          fi

      - name: Terraform destroy plan
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
          terraform show -no-color destroy.tfplan > destroy.tfplan.txt
          sha256sum destroy.tfplan | awk '{print $1}' > destroy.tfplan.sha256
          python ../scripts/create_plan_metadata.py \
            --output metadata.json \
            --plan-file destroy.tfplan \
            --lockfile .terraform.lock.hcl \
            --applyable true \
            --event workflow_dispatch \
            --action plan \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --stack "${STACK}" \
            --environment "${ENVIRONMENT}" \
            --commit-sha "${GITHUB_SHA}" \
            --head-branch "${GITHUB_REF_NAME}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --terraform-version "${{ steps.tfversion.outputs.version }}" \
            --state-key "${STATE_KEY}"

      - name: Publish destroy summary
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          {
            echo "## Destroy plan"
            echo
            echo "- Stack: \`${STACK}\`"
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- Plan SHA-256: \`$(cat destroy.tfplan.sha256)\`"
            echo
            echo '```terraform'
            sed -n '1,500p' destroy.tfplan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/destroy.tfplan
            ${{ env.WORKING_DIRECTORY }}/destroy.tfplan.txt
            ${{ env.WORKING_DIRECTORY }}/destroy.tfplan.sha256
            ${{ env.WORKING_DIRECTORY }}/metadata.json
          retention-days: 3
          if-no-files-found: error

  destroy-apply:
    name: Apply exact destroy plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    needs: destroy-plan
    permissions:
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: terraform-dev-infra
      cancel-in-progress: false
    env:
      STATE_KEY: ${{ vars.TF_STATE_PREFIX }}/dev/terraform.tfstate
      ARTIFACT_NAME: tfdestroy-manual-${{ github.run_id }}-infra-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download destroy plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: downloaded-destroy

      - name: Verify metadata and checkout exact commit
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha="$(python -c 'import json; print(json.load(open("downloaded-destroy/metadata.json"))["commitSha"])')"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"
          python scripts/verify_plan_metadata.py \
            --metadata downloaded-destroy/metadata.json \
            --plan-file downloaded-destroy/destroy.tfplan \
            --lockfile "${WORKING_DIRECTORY}/.terraform.lock.hcl" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --stack "${STACK}" \
            --environment "${ENVIRONMENT}" \
            --state-key "${STATE_KEY}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --allow-lockfile-mismatch
          git checkout --detach "${commit_sha}"
          echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"
          cp downloaded-destroy/destroy.tfplan "${WORKING_DIRECTORY}/destroy.tfplan"

      - name: Bootstrap Terraform
        uses: ./.github/actions/terraform-bootstrap
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          terraform-version: ${{ steps.metadata.outputs.version }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::484632959006:role/aws-chatbot
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-region: ${{ vars.TF_STATE_REGION }}
          state-key: ${{ env.STATE_KEY }}

      - name: Apply destroy plan
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -Eeuo pipefail
          terraform apply -input=false -auto-approve destroy.tfplan | tee destroy-output.txt
          {
            echo "## Terraform destroy apply"
            echo
            echo "- Stack: \`${STACK}\`"
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Destroy plan run ID: \`${GITHUB_RUN_ID}\`"
            echo
            echo '```terraform'
            sed -n '1,400p' destroy-output.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
