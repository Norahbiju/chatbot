name: Terraform Bootstrap
description: Shared Terraform setup, AWS OIDC authentication, backend init, and validation.

inputs:
  working-directory:
    required: true
    description: Terraform root module directory.
  terraform-version:
    required: true
    description: Terraform version to install.
  aws-region:
    required: true
    description: AWS region for provider and STS.
  role-to-assume:
    required: true
    description: AWS IAM role ARN to assume through GitHub OIDC.
  aws-account-id:
    required: true
    description: Expected AWS account ID.
  state-bucket:
    required: true
    description: Existing S3 Terraform state bucket.
  state-region:
    required: true
    description: Region of the Terraform state bucket.
  state-key:
    required: true
    description: Stack-specific Terraform state key.
  aws-profile:
    required: false
    default: github-actions
    description: Named AWS profile used for Terraform and AWS CLI commands.

outputs:
  backend-config:
    description: Path to the generated backend configuration file.
    value: ${{ steps.backend.outputs.backend_config }}

runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Configure Terraform plugin cache
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "${HOME}/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "${GITHUB_ENV}"

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-plugin-cache-${{ runner.os }}-${{ inputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-plugin-cache-${{ runner.os }}-${{ inputs.terraform-version }}-

    - name: Show GitHub OIDC claims
      shell: bash
      run: |
        set -Eeuo pipefail
        token_response="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
        token="$(jq -r '.value' <<< "${token_response}")"
        payload="$(cut -d '.' -f 2 <<< "${token}")"
        payload="${payload//-/+}"
        payload="${payload//_/\/}"
        while (( ${#payload} % 4 )); do payload="${payload}="; done
        claims="$(printf '%s' "${payload}" | base64 -d 2>/dev/null)"
        echo "${claims}" | jq '{sub,aud,repository,repository_owner,ref,workflow,event_name,job_workflow_ref}'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        audience: sts.amazonaws.com
        role-session-name: github-actions-terraform
        aws-profile: ${{ inputs.aws-profile }}
        output-env-credentials: false
        overwrite-aws-profile: true

    - name: Use AWS profile
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "AWS_PROFILE=${{ inputs.aws-profile }}" >> "${GITHUB_ENV}"

    - name: Verify AWS identity
      shell: bash
      run: |
        set -Eeuo pipefail
        account="$(aws sts get-caller-identity --query 'Account' --output text)"
        if [[ "${account}" != "${{ inputs.aws-account-id }}" ]]; then
          echo "Expected AWS account ${{ inputs.aws-account-id }} but assumed ${account}." >&2
          exit 1
        fi
        echo "Assumed expected AWS account ${account}."

    - name: Generate backend config
      id: backend
      shell: bash
      run: |
        set -Eeuo pipefail
        backend_config="${RUNNER_TEMP}/terraform-backend-${{ inputs.state-key }}.hcl"
        mkdir -p "$(dirname "${backend_config}")"
        cat > "${backend_config}" <<BACKEND
        bucket       = "${{ inputs.state-bucket }}"
        key          = "${{ inputs.state-key }}"
        region       = "${{ inputs.state-region }}"
        encrypt      = true
        use_lockfile = true
        BACKEND
        echo "backend_config=${backend_config}" >> "${GITHUB_OUTPUT}"

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -Eeuo pipefail
        terraform init -input=false -backend-config="${{ steps.backend.outputs.backend_config }}"

    - name: Terraform validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -Eeuo pipefail
        terraform validate
