<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatBot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Chat history">
        <div class="sidebar-top">
          <button id="newConversation" class="new-chat-button" type="button">
            <span aria-hidden="true">+</span>
            <span>New chat</span>
          </button>
        </div>

        <nav class="history-panel" aria-label="Previous chats">
          <p class="history-label">Chats</p>
          <div id="historyList" class="history-list"></div>
        </nav>
      </aside>

      <main class="chat-main">
        <section id="messages" class="messages" aria-live="polite" aria-label="Conversation"></section>

        <div class="composer-wrap">
          <form id="chatForm" class="composer">
            <label for="messageInput" class="sr-only">Message</label>
            <textarea id="messageInput" maxlength="2000" rows="1" placeholder="Message ChatBot"></textarea>
            <button id="sendButton" type="submit" aria-label="Send message">&gt;</button>
          </form>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
