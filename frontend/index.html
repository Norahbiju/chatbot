<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bedrock RAG Chat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Bedrock RAG Chat</h1>
          <p>Ask questions about the included infrastructure notes.</p>
        </div>
        <button id="newConversation" type="button" title="Start a new conversation">New conversation</button>
      </header>
      <section id="messages" class="messages" aria-live="polite" aria-label="Conversation"></section>
      <form id="chatForm" class="composer">
        <label for="messageInput" class="sr-only">Message</label>
        <textarea id="messageInput" maxlength="2000" rows="2" placeholder="Ask about Terraform, Kubernetes, or GitHub Actions OIDC"></textarea>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
